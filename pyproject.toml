[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgeraser"
version = "0.4.0"
description = "Remove image backgrounds locally — CLI, Python library and a tiny web UI. No uploads, no API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Tavrej (Yonzon Studio)", email = "tavrejstudio@gmail.com" }]
keywords = ["background removal", "remove background", "rembg", "image", "transparent png", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "rembg>=2.0.50",
  "onnxruntime>=1.16",
  "pillow>=10.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
dev = ["pytest>=7", "flask>=3.0"]

[project.scripts]
bgeraser = "bgeraser.cli:main"

[project.urls]
Homepage = "https://github.com/guesttavrej/bgeraser"
Issues = "https://github.com/guesttavrej/bgeraser/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bgeraser = ["templates/*.html", "samples/*"]
